<!DOCTYPE html>
<html lang="en">
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Root101</title>
    <meta name="description" content="Root101: software engineering, from the root. Open source tools for developers and apps for people.">

    <!-- Responsive -->
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Root101">

    <!-- Theme color -->
    <meta name="theme-color" content="#06071A">

    <!-- Icons -->
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        /* Same palette as the app (AppColors), so there is no jump while Flutter loads */
        * {
          box-sizing: border-box;
        }

        html,
        body {
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 0;
          overflow: hidden;
          background: #06071A; /* surface.background */
          font-family: system-ui, sans-serif;
        }

        #splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 28px;
          background: #06071A;
          z-index: 9999;
          transition: opacity 0.35s ease;
        }

        #splash-logo {
          width: 150px;
          height: 96px;
          filter: drop-shadow(0 0 24px rgba(91, 91, 255, 0.6));
        }

        .loader {
          width: 220px;
          height: 4px;
          background: #22264F; /* surface.stroke */
          border-radius: 999px;
          overflow: hidden;
          position: relative;
        }

        .loader::before {
          content: "";
          position: absolute;
          left: -40%;
          width: 40%;
          height: 100%;
          background: #5CF2C0; /* brand.signal */
          border-radius: 999px;
          animation: loading 1.2s infinite ease;
        }

        @keyframes loading {
          0% {
            left: -40%;
          }

          100% {
            left: 100%;
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .loader::before {
            animation: none;
            left: 0;
            width: 100%;
            opacity: 0.5;
          }
        }

        .fade-out {
          opacity: 0;
          pointer-events: none;
        }
    </style>
</head>

<body>

<!-- Splash -->
<div id="splash" role="status" aria-live="polite">
    <svg id="splash-logo" viewBox="8 6 106 68" aria-label="Root101"><path d="M12 12 H28.5 V68 H19.5 V21 H12 Z M94 12 H110.5 V68 H101.5 V21 H94 Z" fill="#EEF0FF"/><g fill="#5B5BFF"><rect x="59.5" y="13" width="7" height="8" rx="0.6"/><rect x="59.5" y="13" width="7" height="8" rx="0.6" transform="rotate(45 63 40)"/><rect x="59.5" y="13" width="7" height="8" rx="0.6" transform="rotate(90 63 40)"/><rect x="59.5" y="13" width="7" height="8" rx="0.6" transform="rotate(135 63 40)"/><rect x="59.5" y="13" width="7" height="8" rx="0.6" transform="rotate(180 63 40)"/><rect x="59.5" y="13" width="7" height="8" rx="0.6" transform="rotate(225 63 40)"/><rect x="59.5" y="13" width="7" height="8" rx="0.6" transform="rotate(270 63 40)"/><rect x="59.5" y="13" width="7" height="8" rx="0.6" transform="rotate(315 63 40)"/></g><circle cx="63" cy="40" r="18" fill="none" stroke="#5B5BFF" stroke-width="7"/><path d="M57 35 L52.5 40 L57 45 M69 35 L73.5 40 L69 45 M64.5 33.5 L61.5 46.5" fill="none" stroke="#5CF2C0" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/></svg>
    <div class="loader"></div>
</div>

<!-- Splash: its language, and removing it on the first frame (no inline scripts, see the CSP) -->
<script src="splash.js"></script>

<!-- Flutter -->
<script src="flutter_bootstrap.js" async=""></script>

</body>

</html>
