server {
    listen 80;
    root /usr/share/nginx/html;
    # no nginx version in the Server header or the error pages
    server_tokens off;

    # CSP and the rest of the security headers. Again in each location with its own add_header,
    # which would otherwise drop the server's
    include /etc/nginx/security_headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml font/ttf;

    # Health check for the orchestrator: nginx answers and the build is in place
    location = /health {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        if (!-f $document_root/index.html) {
            return 503 '{"status":"DOWN"}';
        }
        return 200 '{"status":"UP"}';
    }

    # no-cache on everything: main.dart.js, canvaskit and assets keep their names between builds, so
    # they are always revalidated (ETag, a 304 if unchanged) and a reload brings the new deploy
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security_headers.conf;
    }
}
