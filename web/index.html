    <style>
        /* Same palette as the app (AppColors), so there is no jump while Flutter loads */
        * {
          box-sizing: border-box;
        }

        html,
        body {
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 0;
          overflow: hidden;
          background: #06071A; /* surface.background */
          font-family: system-ui, sans-serif;
        }

        #splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 28px;
          background: #06071A;
          z-index: 9999;
          transition: opacity 0.35s ease;
        }

        #splash-logo {
          width: 150px;
          height: 96px;
          filter: drop-shadow(0 0 24px rgba(91, 91, 255, 0.6));
        }

        #splash-wordmark {
          width: 220px;
          height: 49px;
          margin-top: -4px;
        }

        .loader {
          width: 220px;
          height: 4px;
          background: #22264F; /* surface.stroke */
          border-radius: 999px;
          overflow: hidden;
          position: relative;
        }

        .loader::before {
          content: "";
          position: absolute;
          left: -40%;
          width: 40%;
          height: 100%;
          background: #5CF2C0; /* brand.signal */
          border-radius: 999px;
          animation: loading 1.2s infinite ease;
        }

        @keyframes loading {
          0% {
            left: -40%;
          }

          100% {
            left: 100%;
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .loader::before {
            animation: none;
            left: 0;
            width: 100%;
            opacity: 0.5;
          }
        }

        .fade-out {
          opacity: 0;
          pointer-events: none;
        }
    </style>
</head>
